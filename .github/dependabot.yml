# Dependabot configuration.
# See https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Go modules. This project depends on cryptographic libraries
  # (go-ethereum, btcd/btcec, solana-go, golang.org/x/crypto), so security
  # updates must not depend on someone noticing them by hand.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"

  # The workflows themselves: keeps the pinned action tags current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci-cd"
