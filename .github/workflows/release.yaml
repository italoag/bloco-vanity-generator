name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string
env:
  GO_VERSION: '1.26.8'

permissions:
  contents: write
  issues: write
  packages: write
  id-token: write
  pull-requests: write
  security-events: write

jobs:
  verify-ci:
    name: Verify CI for release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.approved.outputs.sha }}
      tag: ${{ steps.approved.outputs.tag }}
    steps:
    - name: Checkout trusted gate
      uses: actions/checkout@v7.0.1
      with:
        ref: main
        persist-credentials: false
    - name: Verify tag and exact CI commit
      id: approved
      uses: actions/github-script@v9.0.0
      env:
        RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      with:
        script: |
          const {releaseTarget} = require('./.github/ci-gate.cjs');
          const target = await releaseTarget(github, context, process.env.RELEASE_TAG);
          for (const [key, value] of Object.entries(target)) core.setOutput(key, value);

  create-release:
    name: Create Release
    needs: verify-ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ needs.verify-ci.outputs.sha }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ needs.verify-ci.outputs.sha }}
        fetch-depth: 0

    - name: Get version
      id: version
      env:
        RELEASE_TAG: ${{ needs.verify-ci.outputs.tag }}
      run: echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from git commits since last tag
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..HEAD")
        else
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
        fi
        
        # Save changelog to file and output
        echo "$CHANGELOG" > changelog.txt
        {
          echo "changelog<<EOF"
          echo "$CHANGELOG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3.0.3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## Changes in ${{ steps.version.outputs.version }}
          
          ${{ steps.changelog.outputs.changelog }}
          
          ## Installation
          
          ### Binary Downloads
          Download the appropriate binary for your platform from the assets below.
          macOS ARM64 always includes a CPU-only artifact. A Metal-enabled macOS ARM64 artifact is published separately when the release runner has a reliable Metal/CGO toolchain.
          
          ### Using Go
          ```bash
          go install github.com/italoag/bloco-wallet-generator/cmd/bloco-vgen@${{ steps.version.outputs.version }}
          ```
          
          ### Docker
          ```bash
          docker pull ghcr.io/italoag/bloco-vgen:${{ steps.version.outputs.version }}
          ```
          
          ## Verification
          All binaries are signed and checksums are provided for verification.
        draft: false
        prerelease: ${{ contains(steps.version.outputs.version, '-') }}

  build-and-upload:
    name: Build and Upload
    runs-on: ubuntu-latest
    needs: create-release
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ needs.create-release.outputs.sha }}
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        export BINARY_NAME=bloco-vgen        
        mkdir -p dist
        
        go build \
          -ldflags="-w -s -X main.Version=${{ needs.create-release.outputs.version }} -X main.GitCommit=${{ needs.create-release.outputs.sha }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o dist/${BINARY_NAME} \
          ./cmd/bloco-vgen

    - name: Create archive
      run: |
        cd dist
        BINARY_NAME=bloco-vgen
          ARCHIVE_NAME="bloco-vgen-${{ needs.create-release.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" "${BINARY_NAME}"
        echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"
        echo "ARCHIVE_PATH=dist/${ARCHIVE_NAME}" >> "$GITHUB_ENV"

    - name: Upload Release Asset
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.create-release.outputs.version }}
        ASSET_PATH: ${{ env.ARCHIVE_PATH }}
      run: gh release upload "$RELEASE_TAG" "$ASSET_PATH" --repo "$GITHUB_REPOSITORY"

  build-and-upload-darwin-arm64-metal:
    name: Build and Upload macOS ARM64 Metal
    runs-on: macos-latest
    needs: create-release
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ needs.create-release.outputs.sha }}
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Build Metal-enabled binary when toolchain supports it
      run: |
        mkdir -p dist
        if ! xcrun -find metal >/dev/null 2>&1; then
          echo "Metal toolchain unavailable on this runner; skipping Metal release artifact."
          echo "METAL_BUILD_READY=false" >> "$GITHUB_ENV"
          exit 0
        fi

        if CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build \
          -ldflags="-w -s -X main.Version=${{ needs.create-release.outputs.version }} -X main.GitCommit=${{ needs.create-release.outputs.sha }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o dist/bloco-vgen \
          ./cmd/bloco-vgen; then
          echo "METAL_BUILD_READY=true" >> "$GITHUB_ENV"
        else
          echo "Metal-enabled build failed on this runner; CPU-only artifacts remain available."
          echo "METAL_BUILD_READY=false" >> "$GITHUB_ENV"
        fi

    - name: Create Metal archive
      if: env.METAL_BUILD_READY == 'true'
      run: |
        cd dist
        ARCHIVE_NAME="bloco-vgen-${{ needs.create-release.outputs.version }}-darwin-arm64-metal.tar.gz"
        tar -czf "${ARCHIVE_NAME}" bloco-vgen
        echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"
        echo "ARCHIVE_PATH=dist/${ARCHIVE_NAME}" >> "$GITHUB_ENV"

    - name: Upload Metal Release Asset
      if: env.METAL_BUILD_READY == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.create-release.outputs.version }}
        ASSET_PATH: ${{ env.ARCHIVE_PATH }}
      run: gh release upload "$RELEASE_TAG" "$ASSET_PATH" --repo "$GITHUB_REPOSITORY"

  generate-checksums:
    name: Generate Checksums
    runs-on: ubuntu-latest
    needs: [create-release, build-and-upload, build-and-upload-darwin-arm64-metal]
    steps:
    - name: Get release assets
      id: assets
      run: |
        # Download release assets to generate checksums
        mkdir -p checksums
        cd checksums
        
        # Get all release assets
        curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
             -H "Accept: application/vnd.github.v3+json" \
             https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ needs.create-release.outputs.version }} | \
             jq -r '.assets[] | select(.name | test("\\.(tar\\.gz|zip)$")) | .browser_download_url' | \
             xargs -I {} wget {}

    - name: Generate checksums
      run: |
        cd checksums
        sha256sum -- * > checksums.txt
        cat checksums.txt

    - name: Upload checksums
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.create-release.outputs.version }}
        ASSET_PATH: checksums/checksums.txt
      run: gh release upload "$RELEASE_TAG" "$ASSET_PATH" --repo "$GITHUB_REPOSITORY"

  docker-build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: create-release
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ needs.create-release.outputs.sha }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/bloco-vgen
        flavor: latest=false
        labels: |
          org.opencontainers.image.revision=${{ needs.create-release.outputs.sha }}
        tags: |
          type=raw,value=${{ needs.create-release.outputs.version }}
          type=semver,pattern={{version}},value=${{ needs.create-release.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ needs.create-release.outputs.version }}
          type=semver,pattern={{major}},value=${{ needs.create-release.outputs.version }}

    - name: Set build variables
      id: vars
      run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

    - name: Build and push Docker image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ needs.create-release.outputs.version }}
          GIT_REV=${{ needs.create-release.outputs.sha }}
          BUILD_DATE=${{ steps.vars.outputs.build_date }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, build-and-upload, build-and-upload-darwin-arm64-metal, generate-checksums, docker-build]
    if: success()
    steps:
    - name: Release Summary
      run: |
        echo "🚀 Release ${{ needs.create-release.outputs.version }} completed!"
        echo "📦 Binaries built for multiple platforms"
        echo "🐳 Docker images pushed to ghcr.io"
        echo "🔍 Checksums generated for verification"
        echo ""
        echo "Download: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}"
