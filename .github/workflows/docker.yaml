name: Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]
  push:
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify-ci:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.approved.outputs.sha }}
      branch: ${{ steps.approved.outputs.branch }}
      tag: ${{ steps.approved.outputs.tag }}
      publish: ${{ steps.approved.outputs.publish }}
    steps:
    - name: Checkout trusted gate
      uses: actions/checkout@v7.0.1
      with:
        ref: main
        persist-credentials: false
    - name: Verify exact CI commit
      id: approved
      uses: actions/github-script@v9.0.0
      with:
        script: |
          const {dockerTarget} = require('./.github/ci-gate.cjs');
          const target = await dockerTarget(github, context);
          for (const [key, value] of Object.entries(target)) core.setOutput(key, value);
          if (!target.publish) core.notice('Publication skipped: branch has advanced past the approved commit.');

  build:
    name: Build Docker Image
    needs: verify-ci
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || (needs.verify-ci.result == 'success' && needs.verify-ci.outputs.publish == 'true')) }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bloco-vgen@${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7.0.1
      with:
        ref: ${{ needs.verify-ci.outputs.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Log in to Container Registry
      if: needs.verify-ci.outputs.publish == 'true'
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get version info
      id: version
      env:
        APPROVED_TAG: ${{ needs.verify-ci.outputs.tag }}
      run: |
        {
          if [ -n "$APPROVED_TAG" ]; then
            echo "VERSION=$APPROVED_TAG"
          else
            echo "VERSION=$(git describe --tags --always --dirty)"
          fi
          echo "GIT_REV=$(git rev-parse --short=7 HEAD)"
          echo "FULL_SHA=$(git rev-parse HEAD)"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        } >> "$GITHUB_OUTPUT"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6.2.0
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bloco-vgen
        flavor: latest=false
        labels: |
          org.opencontainers.image.revision=${{ steps.version.outputs.FULL_SHA }}
        tags: |
          type=ref,event=pr
          type=raw,value=${{ needs.verify-ci.outputs.branch }},enable=${{ needs.verify-ci.outputs.branch != '' }}
          type=raw,value=${{ needs.verify-ci.outputs.tag }},enable=${{ needs.verify-ci.outputs.tag != '' }}
          type=semver,pattern={{version}},value=${{ needs.verify-ci.outputs.tag }},enable=${{ needs.verify-ci.outputs.tag != '' }}
          type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify-ci.outputs.tag }},enable=${{ needs.verify-ci.outputs.tag != '' }}
          type=semver,pattern={{major}},value=${{ needs.verify-ci.outputs.tag }},enable=${{ needs.verify-ci.outputs.tag != '' }}
          type=raw,value=latest,enable=${{ needs.verify-ci.outputs.branch == 'main' }}
          type=raw,value=sha-${{ steps.version.outputs.GIT_REV }},priority=100

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ needs.verify-ci.outputs.publish == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GIT_REV=${{ steps.version.outputs.GIT_REV }}
          BUILD_DATE=${{ steps.version.outputs.BUILD_DATE }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Trivy vulnerability scanner
      if: needs.verify-ci.outputs.publish == 'true'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/bloco-vgen@${{ steps.build.outputs.digest }}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      if: needs.verify-ci.outputs.publish == 'true'
      uses: github/codeql-action/upload-sarif@v4.38.0
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Load smoke-test image
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        platforms: linux/amd64
        load: true
        push: false
        tags: bloco-vgen:smoke
        build-args: |
          VERSION=${{ steps.version.outputs.VERSION }}
          GIT_REV=${{ steps.version.outputs.GIT_REV }}
          BUILD_DATE=${{ steps.version.outputs.BUILD_DATE }}
        cache-from: type=gha

    - name: Test Docker image
      env:
        EXPECTED_VERSION: ${{ steps.version.outputs.VERSION }}
        EXPECTED_COMMIT: ${{ steps.version.outputs.GIT_REV }}
      run: |
        # Test that the image runs correctly
        docker run --rm bloco-vgen:smoke --help
        output=$(docker run --rm bloco-vgen:smoke version)
        printf '%s\n' "$output"
        [[ "$output" == *"Bloco Vanity Generator $EXPECTED_VERSION"* ]]
        [[ "$output" == *"Git Commit: $EXPECTED_COMMIT"* ]]

  multi-arch-test:
    name: Multi-Architecture Test
    runs-on: ubuntu-latest
    needs: [verify-ci, build]
    if: needs.verify-ci.outputs.publish == 'true'
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]

    steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Test image on ${{ matrix.platform }}
      env:
        IMAGE_REF: ${{ needs.build.outputs.image }}
      run: |
        # Test the specific platform image
        docker run --rm --platform ${{ matrix.platform }} \
          "$IMAGE_REF" \
          --help

  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    needs: [verify-ci, build, multi-arch-test]
    if: needs.verify-ci.outputs.publish == 'true' && needs.verify-ci.outputs.branch == 'main'
    permissions:
      contents: read
      packages: write

    steps:
    - name: Delete old images
      uses: actions/github-script@v9.0.0
      with:
        script: |
          const owner = context.repo.owner;
          const packageName = 'bloco-vgen';
          
          try {
            // Get all versions of the package
            const versions = await github.rest.packages.getAllPackageVersionsForPackageOwnedByUser({
              username: owner,
              package_type: 'container',
              package_name: packageName,
              per_page: 100
            });
            
            // Keep the 10 most recent versions and delete the rest
            const versionsToDelete = versions.data
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(10);
            
            for (const version of versionsToDelete) {
              // Skip tagged versions (releases)
              if (version.metadata && version.metadata.container && version.metadata.container.tags.length > 0) {
                const hasReleaseTag = version.metadata.container.tags.some(tag => 
                  tag.match(/^v?\d+\.\d+\.\d+/) || tag === 'latest'
                );
                if (hasReleaseTag) {
                  console.log(`Skipping version ${version.id} with release tags: ${version.metadata.container.tags.join(', ')}`);
                  continue;
                }
              }
              
              try {
                await github.rest.packages.deletePackageVersionForUser({
                  username: owner,
                  package_type: 'container',
                  package_name: packageName,
                  package_version_id: version.id
                });
                console.log(`Deleted version ${version.id}`);
              } catch (error) {
                console.log(`Failed to delete version ${version.id}: ${error.message}`);
              }
            }
          } catch (error) {
            console.log(`Error managing package versions: ${error.message}`);
          }