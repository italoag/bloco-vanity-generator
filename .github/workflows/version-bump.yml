name: Bump Version and Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write
  pull-requests: read

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  verify-ci:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.approved.outputs.sha }}
      publish: ${{ steps.approved.outputs.publish }}
    steps:
      - name: Checkout trusted gate
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact CI commit
        id: approved
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const {automaticTarget} = require('./.github/ci-gate.cjs');
            const target = await automaticTarget(github, context);
            for (const [key, value] of Object.entries(target)) core.setOutput(key, value);
            if (!target.publish) core.notice('Publication skipped: main has advanced past the approved commit.');

  bump:
    needs: verify-ci
    if: needs.verify-ci.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ needs.verify-ci.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check existing version tag
        id: current
        run: |
          current_tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          if [[ -n "$current_tag" ]]; then
            echo "Commit ${RELEASE_SHA} already has version tag $current_tag. Skipping bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=$current_tag" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get last tag
        if: steps.current.outputs.skip != 'true'
        id: last
        run: |
          tag=$(git tag --list --sort=-version:refname | awk '
            /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && !found { print; found=1 }
            END { if (!found) print "v0.0.0" }
          ')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        if: steps.current.outputs.skip != 'true'
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=${{ steps.last.outputs.tag }}
          version=${last#v}
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
          else
            echo "Warning: Tag '$last' does not follow semantic versioning. Defaulting to v0.0.0."
            major=0
            minor=0
            patch=0
          fi

          prs_json=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/pulls" 2>/dev/null || echo "[]")

          src_branch=$(jq -r '[.[] | select(.base.ref == "main" and .merged_at != null)] | sort_by(.merged_at) | last | .head.ref // empty' <<< "$prs_json")
          pr_number=$(jq -r '[.[] | select(.base.ref == "main" and .merged_at != null)] | sort_by(.merged_at) | last | .number // empty' <<< "$prs_json")

          if [[ -z "$src_branch" ]]; then
            commit_message=$(git log -1 --pretty=%B)
            if [[ "$commit_message" =~ Merge[[:space:]]pull[[:space:]]request[[:space:]]#[0-9]+[[:space:]]from[[:space:]][^/]+/(.+) ]]; then
              src_branch="${BASH_REMATCH[1]}"
            elif [[ "$commit_message" =~ Merge[[:space:]]remote-tracking[[:space:]]branch[[:space:]]\'origin/([^\']+)\' ]]; then
              src_branch="${BASH_REMATCH[1]}"
            elif [[ "$commit_message" =~ Merge[[:space:]]branch[[:space:]]\'([^\']+)\' ]]; then
              src_branch="${BASH_REMATCH[1]}"
            fi
          fi

          if [[ -z "$src_branch" ]]; then
            bump="patch"
            reason="direct commit to main"
          elif [[ "$src_branch" == hotfix/* || "$src_branch" == fix/* ]]; then
            bump="patch"
            reason="hotfix source branch: $src_branch"
          elif [[ "$src_branch" == milestone || "$src_branch" == milestone/* ]]; then
            bump="major"
            reason="milestone source branch: $src_branch"
          elif [[ "$src_branch" == development ]]; then
            bump="minor"
            reason="development source branch"
          elif [[ -n "$pr_number" ]]; then
            bump="minor"
            reason="merged PR #$pr_number from $src_branch"
          else
            bump="minor"
            reason="merge from $src_branch"
          fi

          echo "Source branch: ${src_branch:-<direct-main>}"
          echo "Bump type: $bump ($reason)"

          if [[ "$bump" == "patch" ]]; then
            patch=$((patch+1))
          elif [[ "$bump" == "minor" ]]; then
            minor=$((minor+1))
            patch=0
          elif [[ "$bump" == "major" ]]; then
            major=$((major+1))
            minor=0
            patch=0
          else
            echo "Unsupported bump type: $bump"
            exit 1
          fi

          {
            echo "version=v${major}.${minor}.${patch}"
            echo "bump=$bump"
            echo "source_branch=${src_branch:-direct-main}"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag
        id: tag
        if: steps.current.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.next.outputs.version }}
          BUMP: ${{ steps.next.outputs.bump }}
          REASON: ${{ steps.next.outputs.reason }}
        run: |
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo "Main advanced before tag creation; publication skipped."
            exit 0
          fi
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG ($BUMP): $REASON"
          git push origin "$NEW_TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Trigger release workflow
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.next.outputs.version }}
        run: |
          gh workflow run release.yaml --ref main -f tag="$NEW_TAG"
